<div id="gallery-{{ .Ordinal }}" data-items="{{ .Get "items" }}" data-speed="{{ .Get "speed" | default 5000 }}" style="position: relative; max-width: 100%; margin: 20px 0; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; background: #eee;">
  <img class="gallery-img" src="" style="width: 100%; height: 400px; object-fit: cover; display: block; margin: 0;">
  <div class="gallery-caption" style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; padding: 12px; text-align: center; font-size: 16px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 5;"></div>
  <button class="gallery-prev" style="position: absolute; top: 50%; left: 10px; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 12px 16px; cursor: pointer; border-radius: 4px; font-size: 18px; z-index: 10; line-height: 1;">❮</button>
  <button class="gallery-next" style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 12px 16px; cursor: pointer; border-radius: 4px; font-size: 18px; z-index: 10; line-height: 1;">❯</button>
</div>
<script>
  (function() {
    const container = document.getElementById("gallery-{{ .Ordinal }}");
    if (!container) return;
    
    const imgEl = container.querySelector(".gallery-img");
    const capEl = container.querySelector(".gallery-caption");
    const prevBtn = container.querySelector(".gallery-prev");
    const nextBtn = container.querySelector(".gallery-next");
    const rawItems = container.getAttribute("data-items") || "";
    const speed = parseInt(container.getAttribute("data-speed"), 10) || 5000;
    
    // Parse items using the pipe "|" delimiter
    const items = rawItems.split(",").map(i => i.trim()).filter(i => i !== "").map(item => {
      const parts = item.split("|");
      return { src: parts[0].trim(), caption: parts[1] ? parts[1].trim() : "" };
    });
    
    if (items.length === 0) return;
    
    let currentIndex = 0;
    let autoTimer;

    function updateSlide() {
      imgEl.src = items[currentIndex].src;
      // Fade in/out the caption bar if text exists
      if (items[currentIndex].caption) {
        capEl.innerText = items[currentIndex].caption;
        capEl.style.opacity = "1";
      } else {
        capEl.style.opacity = "0";
      }
    }

    function goNext() {
      currentIndex++;
      if (currentIndex >= items.length) currentIndex = 0;
      updateSlide();
    }

    function goPrev() {
      currentIndex--;
      if (currentIndex < 0) currentIndex = items.length - 1;
      updateSlide();
    }

    // This ensures clicking a button resets the auto-play timer so it doesn't double-skip
    function resetTimer() {
      clearInterval(autoTimer);
      if (items.length > 1) {
        autoTimer = setInterval(goNext, speed);
      }
    }

    prevBtn.addEventListener("click", function() { goPrev(); resetTimer(); });
    nextBtn.addEventListener("click", function() { goNext(); resetTimer(); });

    updateSlide();
    resetTimer();
  })();
</script>
