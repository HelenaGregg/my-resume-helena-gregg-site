<div id="gallery-{{ .Ordinal }}" data-images="{{ .Get "images" }}" style="position: relative; max-width: 100%; margin: 20px 0; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; background: #eee;">
  <img class="gallery-img" src="" style="width: 100%; height: 400px; object-fit: cover; display: block; margin: 0;">
  <button class="gallery-prev" style="position: absolute; top: 50%; left: 10px; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 12px 16px; cursor: pointer; border-radius: 4px; font-size: 18px; z-index: 10; line-height: 1;">❮</button>
  <button class="gallery-next" style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 12px 16px; cursor: pointer; border-radius: 4px; font-size: 18px; z-index: 10; line-height: 1;">❯</button>
</div>
<script>
  (function() {
    // 1. Find this specific gallery on the page
    const container = document.getElementById("gallery-{{ .Ordinal }}");
    if (!container) return;

    const imgEl = container.querySelector(".gallery-img");
    const prevBtn = container.querySelector(".gallery-prev");
    const nextBtn = container.querySelector(".gallery-next");

    // 2. Read the image list safely from the HTML attribute
    const rawImages = container.getAttribute("data-images") || "";
    
    // 3. Clean up the array (removes spaces and empty strings)
    const images = rawImages.split(",").map(i => i.trim()).filter(i => i !== "");
    if (images.length === 0) return;

    // 4. Set the initial state
    let currentIndex = 0;
    imgEl.src = images[currentIndex];

    // 5. Attach safe event listeners (no inline onclicks)
    prevBtn.addEventListener("click", function() {
      currentIndex--;
      if (currentIndex < 0) currentIndex = images.length - 1;
      imgEl.src = images[currentIndex];
    });

    nextBtn.addEventListener("click", function() {
      currentIndex++;
      if (currentIndex >= images.length) currentIndex = 0;
      imgEl.src = images[currentIndex];
    });
  })();
</script>
